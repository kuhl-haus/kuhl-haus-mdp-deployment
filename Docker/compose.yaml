services:
  mdc:
    image: redis/redis-stack:latest
    container_name: mdc
    ports:
      - "6379:6379"
      - "8001:8001"
    environment:
      REDIS_PASSWORD: redis
    volumes:
      - mdc_data:/data
    networks:
      - data_plane
    restart: unless-stopped
  mdq:
    image: docker.io/rabbitmq:latest
    container_name: mdq
    ports:
      - "0.0.0.0:5672:5672"
      - "0.0.0.0:15672:15672"
      - "0.0.0.0:25672:25672"
      - "0.0.0.0:4369:4369"
    networks:
      - data_plane
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: mdq
      RABBITMQ_DEFAULT_PASS: mdq
      RABBITMQ_ENABLED_PLUGINS: "rabbitmq_management,rabbitmq_prometheus,rabbitmq_management_agent,rabbitmq_web_dispatch"
    volumes:
      - mdq_data:/var/lib/rabbitmq

  mdl:
    image: ghcr.io/kuhl-haus/kuhl-haus-mdl-server:latest
    container_name: mdl
    ports:
      - "0.0.0.0:4200:4200"
    networks:
      - data_plane
    environment:
      MASSIVE_API_KEY: 'Add your API key here!'
      RABBITMQ_URL: amqp://mdq:mdq@mdq:5672/%2F
      MARKET_DATA_MESSAGE_TTL: 5000
      MARKET_DATA_LISTENER_AUTO_START_ENABLED: True
      MASSIVE_SUBSCRIPTIONS: '["A.*"]'
    depends_on:
      - mdq
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4200/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  mdp:
    image: ghcr.io/kuhl-haus/kuhl-haus-mdp-server:latest
    container_name: mdp
    ports:
      - "0.0.0.0:4201:4201"
    networks:
      - data_plane
    environment:
      MASSIVE_API_KEY: 'Add your API key here!'
      REDIS_URL: redis://mdc:6379/0
      RABBITMQ_URL: amqp://mdq:mdq@mdq:5672/%2F
    depends_on:
      - mdc
      - mdq
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4201/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  wds:
    image: ghcr.io/kuhl-haus/kuhl-haus-wds-server:latest
    container_name: wds
    ports:
      - "0.0.0.0:4202:4202"
    networks:
      - data_plane
    environment:
      AUTH_ENABLED: True
      AUTH_API_KEY: "Change me!"
      REDIS_URL: redis://mdc:6379/0
    depends_on:
      - mdc
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4202/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  scp:
    user: "999:999"
    container_name: scp
    image: ghcr.io/kuhl-haus/kuhl-haus-mdp-app-server:latest
    networks:
      - scp
      - data_plane
    restart: unless-stopped
    environment:
      DEFAULT_LOGIN_ENABLED: true
      WDS_ENDPOINT: "ws://localhost:4202/ws"
      WDS_API_KEY: "Change me!"
    depends_on:
      - wds
    stdin_open: true
    tty: true
    ports:
      - "0.0.0.0:8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    volumes:
      - scp_default_db:/home/py4web/apps/_default/databases/
      - scp_default_uploads:/home/py4web/apps/_default/uploads/
volumes:
  mdc_data:
  mdq_data:
  scp_default_db:
  scp_default_uploads:

networks:
  data_plane:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.29.13.0/24
          ip_range: 172.29.13.128/25
          gateway: 172.29.13.1
  scp:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.31.13.0/24
          ip_range: 172.31.13.128/25
          gateway: 172.31.13.1